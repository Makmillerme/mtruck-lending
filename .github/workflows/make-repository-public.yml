name: Make repository public

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/make-repository-public.yml

permissions:
  administration: write
  contents: read
  packages: write

jobs:
  visibility:
    runs-on: ubuntu-latest
    steps:
      - name: Set repository visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VISIBILITY=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            | jq -r '.private')

          if [ "${VISIBILITY}" = "true" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
              -d '{"private":false}'
            echo "Repository is now public."
          else
            echo "Repository is already public."
          fi

      - name: Set GHCR package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -sS -o /tmp/pkg.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/mtruck-lending/visibility" \
            -d '{"visibility":"public"}')

          if [ "${STATUS}" = "204" ] || [ "${STATUS}" = "200" ]; then
            echo "GHCR package visibility set to public."
          else
            echo "GHCR package visibility update returned HTTP ${STATUS} (package may not exist yet)."
            cat /tmp/pkg.json || true
          fi
